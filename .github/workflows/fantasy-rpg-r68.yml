name: Fantasy RPG R67 Lucia and browser regression
on:
  push:
    branches: [main, 'work/lucia-r68']
    paths: ['fantasy-rpg/*r68*', 'fantasy-rpg/assets/r68/**', '.github/workflows/fantasy-rpg-r68.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --experimental-default-type=module fantasy-rpg/test-r68-lucia.mjs
          node --experimental-default-type=module fantasy-rpg/test-r67-glen.mjs
          node --experimental-default-type=module fantasy-rpg/test-r66-options.mjs
          node --experimental-default-type=module fantasy-rpg/test-r65-pixels.mjs
          node --experimental-default-type=module fantasy-rpg/test-r64-pixels.mjs
          node --experimental-default-type=module fantasy-rpg/test-r63-pixels.mjs
          node --experimental-default-type=module fantasy-rpg/test-r62-pixels.mjs
          node --experimental-default-type=module fantasy-rpg/test-r61-preview.mjs
          node --experimental-default-type=module fantasy-rpg/test-r59-battle.mjs
          node --experimental-default-type=module fantasy-rpg/test-r58-victory.mjs
          node --experimental-default-type=module fantasy-rpg/test-r52-field.mjs
      - run: npm install --prefix "$RUNNER_TEMP/rpg-browser" --no-save --no-package-lock playwright
      - name: Real mobile UI and all 64 Lucia appearances
        run: PLAYWRIGHT_REQUIRE_FROM="$RUNNER_TEMP/rpg-browser/entry.cjs" node fantasy-rpg/test-r68-lucia-ui.mjs
