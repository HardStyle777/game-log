name: Lumina RPG verification
on:
  push:
    paths: ['monster-rpg/**', '.github/workflows/lumina-rpg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
        working-directory: monster-rpg
      - run: npm test
        working-directory: monster-rpg
      - run: node scripts/balance-check.js
        working-directory: monster-rpg
