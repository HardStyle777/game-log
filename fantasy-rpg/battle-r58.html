<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy RPG — 戦闘画面 R58</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="skin.css?v=21"></head><body><main class="battle-screen">
<header class="gold top"><span>⚔ バトル</span><span id="turn">TURN 1</span></header>
<section class="gold field"><div class="battle-stage"><canvas id="field" width="480" height="400" aria-label="戦闘フィールド"></canvas><div id="fieldTargets" hidden></div><div id="target" class="enemy-hud"><span id="enemyName">蒼牙狼</span><div class="bar enemy"><i id="enemyBar"></i></div></div></div></section>
<section class="gold action-strip"><div id="message" role="status" aria-live="polite">素材読み込み中</div><button id="submit" class="confirm" hidden>行動開始</button><button id="skip" hidden>演出省略</button><button id="fieldReturn" hidden>マップへ戻る</button></section>
<section class="lower"><nav class="gold menu" aria-label="戦闘コマンド"><button data-action="basic"><img class="cmd-icon" alt="" src="assets/icon-basic.png"> 戦う</button><button data-action="skill"><img class="cmd-icon" alt="" src="assets/icon-skill.png"> スキル</button><button data-action="tech"><img class="cmd-icon" alt="" src="assets/icon-tech.png"> 特技</button><button data-action="guard"><img class="cmd-icon" alt="" src="assets/icon-guard.png"> 防御</button><button data-action="potion"><img class="cmd-icon" alt="" src="assets/icon-potion.png"> アイテム</button><button data-action="escape" disabled><img class="cmd-icon" alt="" src="assets/icon-escape.png"> 逃げる</button></nav><div class="party" id="party"></div></section>
<div id="mode" hidden></div><div class="small" id="notice" role="alert" hidden></div>
<dialog id="choice" class="gold target-dialog" aria-labelledby="choiceTitle"><h2 id="choiceTitle">対象を選択</h2><div id="choiceInfo" class="small"></div><div id="choiceList"></div><button id="choiceCancel">戻る</button></dialog></main><script type="module" src="app-r58.js?v=58"></script></body></html>
