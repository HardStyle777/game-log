<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy RPG — 戦闘画面 R14</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="skin.css"></head><body><main>
<header class="gold top"><span>⚔ バトル</span><span id="turn">TURN 1</span></header>
<section class="gold field"><canvas id="field" width="480" height="326" aria-label="戦闘フィールド"></canvas><div id="target" class="enemy-hud"><span id="enemyName">蒼牙狼</span><div class="bar enemy"><i id="enemyBar"></i></div></div></section>
<section class="lower"><nav class="gold menu" aria-label="戦闘コマンド"><button data-action="basic"><img class="cmd-icon" alt="" src="assets/icon-basic.png"> 戦う</button><button data-action="skill"><img class="cmd-icon" alt="" src="assets/icon-skill.png"> スキル</button><button data-action="tech"><img class="cmd-icon" alt="" src="assets/icon-tech.png"> 特技</button><button data-action="guard"><img class="cmd-icon" alt="" src="assets/icon-guard.png"> 防御</button><button data-action="potion"><img class="cmd-icon" alt="" src="assets/icon-potion.png"> アイテム</button><button data-action="escape" disabled><img class="cmd-icon" alt="" src="assets/icon-escape.png"> 逃げる</button></nav><div class="party" id="party"></div></section>
<div class="gold footer"><div id="message" role="status" aria-live="polite">素材読み込み中</div><div class="switch"><button id="normal" aria-pressed="true">通常戦</button><button id="boss" aria-pressed="false">大型ボス</button><button id="submit" class="confirm" hidden>行動開始</button><button id="skip" hidden>演出を省略</button></div><div id="mode" class="small">ブラウザ戦闘試験版</div><div class="small" id="notice" hidden></div></div>
<dialog id="choice" class="gold target-dialog" aria-labelledby="choiceTitle"><h2 id="choiceTitle">対象を選択</h2><div id="choiceInfo" class="small"></div><div id="choiceList"></div><button id="choiceCancel">戻る</button></dialog></main><script type="module" src="app.js"></script></body></html>
