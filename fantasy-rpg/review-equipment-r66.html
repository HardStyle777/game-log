<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>装備の比較 | Fantasy RPG</title>
<link rel="stylesheet" href="style.css">
<style>
body{display:block;background:#131e2c;color:#f8ecd8;font:15px system-ui,sans-serif;margin:16px}
main{max-width:660px;margin:auto}h1{font-size:1.5rem;margin:.6em 0}a{color:#f4d48c}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}select,button{min-height:44px;font:inherit}.controls label{display:flex;gap:6px;align-items:center}
#outfits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
article{background:#233747;border:1px solid #a88b55;padding:6px;border-radius:5px;text-align:center}
h2{font-size:1rem;line-height:1.2;margin:.4em 0;min-height:2.4em;display:grid;place-items:center}
figure{margin:4px 0}figcaption{margin-top:2px;color:#eedab1;font-size:.8rem}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;background:#2b3a4b}
.exploration{display:grid;grid-template-columns:1fr 1fr;gap:5px}.exploration canvas{background:#354c42}
</style>
</head>
<body>
<main>
  <h1>装備の比較</h1>
  <nav><a href="field-r66.html">探索へ</a> ／ <a href="battle-r66.html">戦闘へ</a></nav>
  <div class="controls">
    <label>キャラクター <select id="actor"><option value="leon">レオン</option><option value="fia">フィア</option></select></label>
    <label>装備 <select id="gear"></select></label>
    <label>戦闘姿勢 <select id="pose"></select></label>
    <label>探索方向 <select id="direction"><option value="0">正面</option><option value="1">右</option><option value="2" selected>背面</option><option value="3">左</option></select></label>
    <button type="button" id="playback" aria-pressed="false">一時停止</button>
  </div>
  <p id="status" role="status">読み込み中</p>
  <div id="outfits"></div>
</main>
<script type="module" src="review-equipment-r66.js"></script>
</body>
</html>
