<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R63 フィア装備比較</title><style>body{font:14px system-ui;background:#132639;color:#fff5de;margin:12px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-width:850px}.pair{border:1px solid #b59659;background:#253a49;padding:6px;text-align:center}.pair h2{font-size:13px;margin:2px}.pair canvas{width:100%;height:auto;image-rendering:pixelated;background:#344f58}.pair .field{width:48%;background:#365e47}button,select{font:inherit;padding:7px;border:1px solid #b59659;color:#fff5de;background:#253a49}a{color:#f4d69a}pre{white-space:pre-wrap}</style><h1>フィアの装備外観 R63</h1><p>実戦闘のアトラスと同じ処理で描画します。元の衣装・武器の保存状態は変更しません。</p><p><a href="field-r63.html">フィールド</a> / <a href="battle-r63.html">戦闘</a> / <a href="review-weapon-poses-r63.html">全姿勢の同寸比較</a></p><label for="pose">戦闘姿勢 </label><select id="pose"><option value="idle">通常</option><option value="attack">攻撃</option><option value="guard">防御</option><option value="hit">被弾</option><option value="down">戦闘不能</option><option value="revive">蘇生</option><option value="victory">勝利ループ</option></select> <label for="dir">探索方向 </label><select id="dir"><option value="0">前</option><option value="1">右</option><option value="2">後</option><option value="3">左</option></select><p id="status">読み込み中</p><main id="root"></main><p><button id="verify" disabled>全576装備の再検査を開始</button></p><pre id="report"></pre><script type="module">
import {fiaMeta,makeFiaAtlas} from './fia-art-r46.js';
import {configureLoop,loopFrame} from './victory-loop-r58.js';
import {equippedImage} from './fia-gear-r63.js?v=63.1';
import {createVerifier} from './test-r63-browser.js?v=63.1';
const paths={battle:'assets/r37/fia-sprite.png',recovery:'assets/r41/fia-recovery.png',attack:'assets/r45/fia-attack.png',stance:'assets/r46/fia-guard-victory.png',field:'assets/r42/fia-field.png',motion:'assets/r43/fia-motion.png',gear:'assets/r48/fia-equipment.png',ornaments:'assets/r47/fia-gear.png',outfit:'assets/r59/fia-outfit.png'},$=id=>document.getElementById(id),status=$('status'),models=[],meta=configureLoop(fiaMeta,'fia');
const settings=[['初期装備',{}],['翠月牙・主武器',{main:'moonfang'}],['金月牙・副武器',{offhand:'moonfang'}],['新衣装＋装飾・双剣',{body:'rangercoat',feet:'rangerboots',main:'moonfang',offhand:'moonfang',head:'circlet',accessory:'brooch'}]];
const draw=(c,img,x,y,w,h)=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,c.width,c.height);g.drawImage(img,x,y,w,h,0,0,c.width,c.height)};
function cycle(fs,t){let n=t%fs.reduce((sum,f)=>sum+f.ms,0);for(const f of fs){if(n<f.ms)return f;n-=f.ms}return fs.at(-1)}
try{const imgs=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>{const i=new Image();i.src=p;await i.decode();return [k,i]})));for(const [name,gear] of settings){const out=['battle','recovery','attack','stance','field','motion'].map(k=>equippedImage(imgs[k],k,gear,imgs.ornaments,imgs.gear,imgs.outfit)),atlas=makeFiaAtlas(...out.slice(0,4)),host=document.createElement('section');host.className='pair';const title=document.createElement('h2');title.textContent=name;host.append(title);const battle=document.createElement('canvas');battle.width=240;battle.height=216;host.append(battle);const field=document.createElement('canvas'),run=document.createElement('canvas');for(const c of [field,run]){c.width=c.height=96;c.className='field';host.append(c)}$('root').append(host);models.push({atlas,battle,field,run,walkImage:out[4],runImage:out[5]})}status.textContent='4種類の外観を同時再生中';let start=performance.now();$('pose').onchange=()=>{start=performance.now()};$('dir').onchange=()=>{start=performance.now()};
function tick(t){const dt=Math.max(0,t-start),mode=$('pose').value,row=Number($('dir').value),f=mode==='victory'?loopFrame(meta,dt).frame:cycle(meta.clips[mode],dt);for(const m of models){draw(m.battle,m.atlas,f.x,f.y,240,216);draw(m.field,m.walkImage,Math.floor(dt/120)%4*96,row*96,96,96);draw(m.run,m.runImage,[0,1,2,1][Math.floor(dt/83)%4]*96,row*96,96,96)}requestAnimationFrame(tick)}requestAnimationFrame(tick);$('verify').disabled=false;$('verify').onclick=async()=>{const button=$('verify'),report=$('report');button.disabled=true;try{const v=await createVerifier();for(let i=0;i<v.list.length;i++){v.verifyOne(v.list[i]);if(i%8===7){report.textContent=JSON.stringify(v.summary(),null,2);await new Promise(resolve=>setTimeout(resolve,0))}}report.textContent=JSON.stringify(v.summary(),null,2)}catch(e){report.textContent='FAIL: '+e.message}finally{button.disabled=false}}}catch(e){status.textContent='読み込みエラー：'+e.message;throw e}
</script></html>
