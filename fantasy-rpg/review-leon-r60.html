<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R60 レオン装備比較</title><style>body{font:14px system-ui;background:#132639;color:#fff5de;margin:12px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-width:850px}.pair{border:1px solid #b59659;background:#253a49;padding:6px;text-align:center}.pair h2{font-size:13px;margin:2px}.pair canvas{width:100%;height:auto;image-rendering:pixelated;background:#344f58}.pair .field{width:48%;background:#365e47}button,select{font:inherit;padding:7px;border:1px solid #b59659;color:#fff5de;background:#253a49}a{color:#f4d69a}pre{white-space:pre-wrap}</style><h1>レオンの装備外観 R60</h1><p>実戦闘と同じ装備済みアトラスで比較。保存状態は変更しません。</p><p><a href="field-r60.html">フィールド</a> / <a href="battle-r60.html">戦闘</a></p><label>戦闘姿勢 <select id="pose"><option value="idle">通常</option><option value="attack">攻撃</option><option value="guard">防御</option><option value="hit">被弾</option><option value="down">戦闘不能</option><option value="revive">蘇生</option><option value="victory">勝利ループ</option></select></label> <label>探索方向 <select id="dir"><option value="0">前</option><option value="1">右</option><option value="2">後</option><option value="3">左</option></select></label><p id="status">読み込み中</p><main id="root"></main><p><button id="verify" disabled>全144装備を再検査</button></p><pre id="report"></pre><script type="module">
import {createVerifier} from './test-r60-browser.js';
import {loopFrame} from './victory-loop-r58.js';
const $=id=>document.getElementById(id),models=[];
const settings=[['初期装備',{}],['王騎士の重装鎧',{body:'royalplate'}],['鋼のサバトン',{feet:'sabaton'}],['重装鎧＋全装飾',{body:'royalplate',feet:'sabaton',main:'sapphire',offhand:'shield',head:'circlet',accessory:'brooch'}]];
function draw(c,img,x,y,w,h){const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,c.width,c.height);g.drawImage(img,x,y,w,h,0,0,c.width,c.height)}
function cycle(fs,t){let n=t%fs.reduce((sum,f)=>sum+f.ms,0);for(const f of fs){if(n<f.ms)return f;n-=f.ms}return fs.at(-1)}
try{const v=await createVerifier();for(const [name,g] of settings){const out=v.verifyOne({main:'iron',offhand:'none',head:'none',body:'blue',feet:'brown',accessory:'none',...g}),host=document.createElement('section');host.className='pair';const title=document.createElement('h2');title.textContent=name;host.append(title);const battle=document.createElement('canvas');battle.width=240;battle.height=216;host.append(battle);const walk=document.createElement('canvas'),run=document.createElement('canvas');for(const c of [walk,run]){c.width=c.height=96;c.className='field';host.append(c)}$('root').append(host);models.push({out,battle,walk,run})}
$('status').textContent='通常・戦闘・探索を同時表示';$('verify').disabled=false;const actor=v.meta.actors.leon;
function tick(t){const pose=$('pose').value,dir=Number($('dir').value),frame=pose==='victory'?loopFrame(actor,t).frame:cycle(actor.clips[pose]??actor.clips.idle,t);for(const m of models){draw(m.battle,m.out.battle,frame.x,frame.y,240,216);draw(m.walk,m.out.walk,Math.floor(t/160)%4*96,dir*96,96,96);draw(m.run,m.out.run,Math.floor(t/100)%4*96,dir*96,96,96)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('verify').onclick=async()=>{$('verify').disabled=true;try{const tester=await createVerifier();for(let i=0;i<tester.list.length;i++){tester.verifyOne(tester.list[i]);if(i%4===3){$('report').textContent=JSON.stringify(tester.summary(),null,2);await new Promise(r=>setTimeout(r,0))}}$('report').textContent=JSON.stringify(tester.summary(),null,2)}catch(e){$('report').textContent=String(e)}finally{$('verify').disabled=false}};
}catch(e){$('status').textContent='読み込み失敗：'+e.message;throw e}</script></html>
