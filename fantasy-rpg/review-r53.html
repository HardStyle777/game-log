<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R53 レオン装備素材検査</title><body style="background:#243545;color:white"><h1>レオン全64装備素材の検査</h1><p>素材描画専用。ゲーム本編ではありません。戦闘・歩行・走行・待機を検査します。</p><pre id="report">検査中</pre><script type="module">import {verify} from './test-r53-browser.js';const e=document.getElementById('report');try{const r=await verify(p=>e.textContent=JSON.stringify(p,null,2));e.textContent=JSON.stringify(r,null,2)}catch(x){e.textContent='FAIL: '+x.message;throw x}</script></body></html>
