<!doctype html><meta charset="utf-8"><body style="background:#293844;color:white"><h1>R55 フィア刀身材質検査</h1><pre id="report">検査中</pre><script type="module">
import {equippedImage,materialMasks,materialCells} from './fia-blades-r55.js';
import {equippedImage as priorImage} from './fia-blades-r54.js';
import * as old from './fia-armour-r50.js';
import {makeFiaAtlas} from './fia-art-r46.js';
const imgs={};for(const k of ['battle','recovery','attack','stance','field','motion','gear','ornaments']){const im=new Image();im.src=({battle:'assets/r37/fia-sprite.png',recovery:'assets/r41/fia-recovery.png',attack:'assets/r45/fia-attack.png',stance:'assets/r46/fia-guard-victory.png',field:'assets/r42/fia-field.png',motion:'assets/r43/fia-motion.png',gear:'assets/r48/fia-equipment.png',ornaments:'assets/r47/fia-gear.png'})[k];await im.decode();imgs[k]=im}
function pix(im){const c=document.createElement('canvas');c.width=im.naturalWidth??im.width;c.height=im.naturalHeight??im.height;const g=c.getContext('2d');g.drawImage(im,0,0);return g.getImageData(0,0,c.width,c.height).data}
const combos=[];for(const body of old.slots.body)for(const feet of old.slots.feet)for(const main of old.slots.main)for(const offhand of old.slots.offhand)for(const head of old.slots.head)for(const accessory of old.slots.accessory)combos.push({body,feet,main,offhand,head,accessory});
let checks=0,frames=0,failures=[],done=0;function ok(v,m,g){checks++;if(!v)failures.push({m,g})}
function cell(p,w,i){const q=new Uint8ClampedArray(240*216*4);for(let y=0;y<216;y++){const j=(y*w+i*240)*4;q.set(p.subarray(j,j+240*4),y*240*4)}return q}
const maskCache={};for(const k of ['recovery','attack','stance'])for(const i of materialCells(k)){maskCache[[k,i]]=materialMasks(cell(pix(imgs[k]),imgs[k].naturalWidth,i),k,i);ok(maskCache[[k,i]].every(m=>m.some(Boolean)),'nonempty mask '+k+' '+i,{})}
function bounds(im,cw,ch,n,g,label){const p=pix(im),w=im.naturalWidth??im.width;for(let i=0;i<n;i++){let seen=0,edge=0;const col=i%(w/cw),row=Math.floor(i/(w/cw));for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)if(p[((row*ch+y)*w+col*cw+x)*4+3]){seen++;if(x===0||y===0||x===cw-1||y===ch-1)edge++}ok(seen>0,label+' empty '+i,g);ok(edge===0,label+' edge '+i,g);frames++}}
window.runBatch=(start,end)=>{for(const g of combos.slice(start,end)){const out={};for(const k of ['battle','recovery','attack','stance','field','motion']){const p=imgs[k],w=p.naturalWidth;out[k]=equippedImage(p,k,g,imgs.ornaments,imgs.gear);const q=pix(out[k]),r=pix(priorImage(p,k,g,imgs.ornaments,imgs.gear));ok(q.length===r.length,'size '+k,g);const active=[g.main==='engraved',g.offhand==='engraved'];if(!active.some(Boolean)||!materialCells(k).length){ok(q.every((v,i)=>v===r[i]),'unchanged '+k,g);continue}const base=pix(old.equippedImage(p,k,{...g,main:'dagger',offhand:'dagger'},imgs.ornaments,imgs.gear));for(let i=0;i<w/240;i++){const a=cell(q,w,i),b=cell(base,w,i),c=cell(r,w,i),m=maskCache[[k,i]];if(!m){ok(a.every((v,j)=>v===c[j]),'R54 unchanged '+k+' '+i,g);continue}let badAlpha=0,badOutside=0,changed=[0,0];for(let z=0;z<240*216;z++){const j=z*4;if(a[j+3]!==b[j+3])badAlpha++;const diff=a[j]!==b[j]||a[j+1]!==b[j+1]||a[j+2]!==b[j+2];if(diff){let allowed=false;for(let s=0;s<2;s++)if(active[s]&&m[s][z]){allowed=true;changed[s]++}if(!allowed)badOutside++}}ok(!badAlpha,'exact silhouette '+k+' '+i,g);ok(!badOutside,'only visible steel '+k+' '+i,g);for(let s=0;s<2;s++)ok(active[s]?changed[s]>0:changed[s]===0,'independent blade '+k+' '+i+' '+s,g)}}
const atlas=makeFiaAtlas(out.battle,out.recovery,out.attack,out.stance);bounds(atlas,240,216,38,g,'battle');bounds(out.field,96,96,16,g,'field');bounds(out.motion,96,96,16,g,'motion');
if(g.body==='green'&&g.feet==='brown'&&g.head==='none'&&g.accessory==='none'&&g.main==='engraved'&&g.offhand==='engraved'){for(const k of ['recovery','attack','stance']){const label=document.createElement('p');label.textContent=k+' / R54 then R55';document.body.append(label);const prev=priorImage(imgs[k],k,g,imgs.ornaments,imgs.gear);document.body.append(prev,out[k]);prev.style.display=out[k].style.display='block'}}done++}return {checks,frames,done,failures:failures.slice(0,20),failureCount:failures.length}};
window.ready=true;for(let i=0;i<144;i+=12){const r=window.runBatch(i,i+12);document.getElementById('report').textContent=JSON.stringify(r,null,2);await new Promise(resolve=>setTimeout(resolve,0))}
</script></body>
