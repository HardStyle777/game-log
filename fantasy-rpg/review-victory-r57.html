<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R57 戦闘終了姿勢</title><style>body{font:14px system-ui;background:#132639;color:#fff5de;margin:10px}main{display:grid;gap:6px}.pair{border:1px solid #b59659;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.pair h2{grid-column:1/-1;margin:0;font-size:15px}.pair canvas{width:100%;height:auto;image-rendering:pixelated;background:#365e47}.pair div{text-align:center}a{color:#f4d69a}</style><h1>戦闘通常時と勝利時</h1><p>ゲームと同じ装備済みアトラスを表示します。レオン・フィアは現在の外観設定を反映します。</p><p><a href="battle-r57.html">戦闘画面</a> / <a href="field-r57.html">フィールド</a></p><p id="status">読み込み中</p><main id="root"></main><script type="module">import {appearanceSources,configureBattleMeta,savedBattleAppearance,buildBattleAppearance} from './battle-appearance-r57.js';import {victoryFrame} from './result-pose-r51.js';const status=document.getElementById('status');try{const raw=await fetch('assets/r26/motion.json').then(r=>{if(!r.ok)throw Error('meta');return r.json()}),meta=configureBattleMeta(raw),assets=Object.fromEntries(await Promise.all([...appearanceSources,'r26/glen-battle','r26/eris-battle'].map(async p=>{const i=new Image();i.src='assets/'+p+'.png';await i.decode();return [p,i]}))),gear=savedBattleAppearance(sessionStorage);for(const [id,name] of [['leon','レオン'],['fia','フィア'],['glen','グレン'],['lucia','ルシア']]){const actor=meta.actors[id==='lucia'?'eris':id],im=buildBattleAppearance(id,assets,gear[id]),host=document.createElement('section');host.className='pair';const title=document.createElement('h2');title.textContent=name;host.append(title);for(const [label,f] of [['通常',actor.clips.idle[0]],['勝利',victoryFrame(actor)]]){const d=document.createElement('div'),c=document.createElement('canvas');c.width=240;c.height=216;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,f.x,f.y,f.w,f.h,0,0,240,216);d.append(label,c);host.append(d)}document.getElementById('root').append(host)}status.textContent='4人の通常・勝利姿勢';}catch(e){status.textContent='読み込みエラー：'+e.message;throw e}</script></html>
