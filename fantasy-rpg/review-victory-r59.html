<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R59 勝利ループ</title><style>body{font:14px system-ui;background:#132639;color:#fff5de;margin:10px}main{display:grid;gap:6px}.pair{border:1px solid #b59659;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.pair h2{grid-column:1/-1;margin:0;font-size:15px}.pair canvas{width:100%;height:auto;image-rendering:pixelated;background:#365e47}.pair div{text-align:center}a{color:#f4d69a}button{min-height:36px}</style><h1>4人の勝利ループ</h1><p><a href="battle-r59.html">戦闘画面</a> / <a href="field-r59.html">フィールド</a></p><button id="pause">停止</button><p id="status">読み込み中</p><main id="root"></main><script type="module">
import {appearanceSources,configureBattleMeta,savedBattleAppearance,buildBattleAppearance} from './battle-appearance-r59.js';
import {loopFrame} from './victory-loop-r58.js';
const status=document.getElementById('status'),rows=[];let paused=false,elapsed=0,last=null;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'停止';last=null};
function draw(c,im,f){const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,240,216);g.drawImage(im,f.x,f.y,f.w,f.h,0,0,240,216)}
try{const raw=await fetch('assets/r26/motion.json').then(r=>{if(!r.ok)throw Error('meta');return r.json()}),meta=configureBattleMeta(raw),assets=Object.fromEntries(await Promise.all([...appearanceSources,'r26/glen-battle','r26/eris-battle'].map(async p=>{const i=new Image();i.src='assets/'+p+'.png';await i.decode();return [p,i]}))),gear=savedBattleAppearance(sessionStorage);
for(const [id,name] of [['leon','レオン'],['fia','フィア'],['glen','グレン'],['lucia','ルシア']]){const actor=meta.actors[id==='lucia'?'eris':id],im=buildBattleAppearance(id,assets,gear[id]),host=document.createElement('section');host.className='pair';const title=document.createElement('h2');title.textContent=name;host.append(title);for(const label of ['通常','勝利ループ']){const d=document.createElement('div'),c=document.createElement('canvas');c.width=240;c.height=216;d.append(label,c);host.append(d);if(label==='通常')draw(c,im,actor.clips.idle[0]);else rows.push({actor,im,c})}document.getElementById('root').append(host)}
status.textContent='実戦闘と同じ装備済み素材で再生中';function tick(t){if(last!==null&&!paused)elapsed+=Math.min(100,t-last);last=t;if(!paused)for(const {actor,im,c} of rows)draw(c,im,loopFrame(actor,elapsed).frame);requestAnimationFrame(tick)}requestAnimationFrame(tick)
}catch(e){status.textContent='読み込みエラー：'+e.message;throw e}</script></html>
