<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R31 建物比較</title><style>body{background:#17272c;color:#edf1e7;font:15px system-ui;margin:12px}main{max-width:560px;margin:auto}section{background:#263a3e;border:1px solid #5d7775;border-radius:8px;margin:12px 0;padding:10px}canvas{width:100%;max-width:396px;height:auto;display:block;margin:auto;image-rendering:pixelated}h2{font-size:16px;margin:0}a{color:#bce4e2}</style><main><h1>R31 建物比較</h1><p>上：R30 ／ 下：R31。緑の集会所は変更なし。</p><a href="./field.html?v=30">現行マップ R30</a><div id="items"></div></main><script type="module">import {houseImage as before} from './town-houses.js?v=30';import {houseImage as after} from './town-houses-r31.js?v=31';import {MAPS} from './field-model.js?v=28';for(const b of MAPS.town.buildings){const s=document.createElement('section');s.innerHTML='<h2>'+b.label+'</h2>';for(const [name,fn] of [['R30',before],['R31',after]]){const label=document.createElement('div');label.textContent=name;s.append(label);const cv=document.createElement('canvas');cv.width=396;cv.height=315;const c=cv.getContext('2d');c.fillStyle='#6ca58b';c.fillRect(0,0,396,315);c.fillStyle='#a7b9c1';c.fillRect(0,270,396,45);const im=fn(b,3);c.drawImage(im,(396-im.width)/2,0);s.append(cv)}document.querySelector('#items').append(s)}</script></html>
