<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10131a"><meta name="apple-mobile-web-app-capable" content="yes"><title>SKILL FORGE</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body><main id="app">
<header><div><small>放置スキル・ハクスラ試作版</small><h1>SKILL FORGE</h1></div><div class="resources"><b id="level">Lv 1</b><span id="gold">0 G</span><button id="inventoryBtn">戦利品 <i id="lootCount">0</i></button></div></header>
<section class="stage">
<div class="wave"><span id="area">灰の街道 1</span><b id="wave">WAVE 1</b></div>
<div id="enemies" class="enemies"></div>
<div class="fighter-zone"><div id="fighter" class="fighter"><div class="shadow"></div><div class="cape"></div><div class="body"></div><div class="head"></div><div class="arm"></div><div class="sword"></div></div><div id="damageLayer"></div></div>
<div id="effect" class="effect"></div>
</section>
<section class="status"><div class="name"><b>剣士</b><small id="action">戦闘開始</small></div><div class="bars"><label>HP <i><em id="hpBar"></em></i><b id="hpText"></b></label><label>CP <i><em id="cpBar"></em></i><b id="cpText"></b></label><label>EXP <i><em id="xpBar"></em></i><b id="xpText"></b></label></div></section>
<section class="sequence"><div class="section-title"><div><small>AUTO SKILL</small><b>発動順</b></div><span>タップで選択 → 別枠をタップして交換</span></div><div id="queue" class="queue"></div></section>
<nav><button id="pauseBtn">一時停止</button><button id="potionBtn">回復薬 <b id="potions">3</b></button><button id="speedBtn">速度 ×1</button><button id="statsBtn">能力</button></nav>
</main>
<div id="modal" class="modal hidden"><section><header><h2 id="modalTitle">戦利品</h2><button id="closeModal">閉じる</button></header><div id="modalBody"></div></section></div>
<script src="./app.js?v=1"></script></body></html>
