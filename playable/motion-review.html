<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剣士の動き</title><link rel="stylesheet" href="style.css?v=journey-ui1"><main><h1>剣士の動き</h1><p><a href="./">冒険へ戻る</a></p><canvas id="scene" width="900" height="460" style="width:100%"></canvas><label>動き <select id="clip"><option value="chain">連続連携デモ</option><option value="basic">通常攻撃 ↙</option><option value="triple">三連斬</option><option value="thrust">突き</option><option value="sweep">横薙ぎ</option><option value="leap">飛び込み</option><option value="flame">焔の飛び込み</option><option value="frost">氷牙</option><option value="thunder">雷光</option><option value="idle">待機</option><option value="walk">接近</option><option value="hurt">被弾</option><option value="potion">回復薬</option><option value="defeat">敗北</option><option value="victory">勝利</option></select></label><button id="play">一時停止</button><label>コマ送り <input id="frame" type="range" min="0" max="1000" value="0"></label><p id="phase">準備中</p><p class="muted">実際の戦闘と同じ描画です。スライダーを動かすと一時停止します。</p></main><script src="art.js?v=size1"></script><script src="motion.js?v=connect2"></script><script src="diagonal.js?v=size1"></script><script src="support.js?v=size1"></script><script src="elements.js"></script><script>
const g=document.getElementById('scene').getContext('2d'),clip=document.getElementById('clip'),slider=document.getElementById('frame'),btn=document.getElementById('play');let motion,support,background,playing=true,time=0,last=null;
Promise.all([SwordArt.load('../restored/connected-combo.webp'),SwordArt.load('../restored/skill-motion-set.webp'),SwordArt.load('assets/diagonal-slash.webp'),SwordArt.load('assets/support.webp')]).then(([a,b,c,d])=>{support=SwordSupport.create(g,d);motion=HeroMotion.create(g,{combo:SwordArt.combo(g,a),other:SwordArt.other(g,b),basic:DiagonalSlash.create(g,c),support});});const bg=new Image();bg.onload=()=>background=bg;bg.src='assets/forest.webp';
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'一時停止':'再生';};slider.oninput=()=>{playing=false;time=+slider.value/1000;btn.textContent='再生';};clip.onchange=()=>{time=0;};
function draw(now){const dt=last===null?0:Math.min(.05,(now-last)/1000);last=now;if(playing)time=(time+dt/(clip.value==='chain'?5:1.5))%1;slider.value=Math.floor(time*1000);g.fillStyle='#142931';g.fillRect(0,0,900,460);if(background)g.drawImage(background,0,0,900,460);if(motion){const id=clip.value;if(id==='chain'){const chain=['triple','thrust','sweep','leap','heal_potion'],phase=time*chain.length,index=Math.min(chain.length-1,Math.floor(phase));motion.draw({id:chain[index],progress:phase-index,now:now/1000,x:160,y:14,token:index});}else if(['idle','walk','hurt','potion','defeat','victory'].includes(id)){g.save();g.translate(160,14);support(id,time*1.5);g.restore();}else {motion.draw({id,progress:time,now:now/1000,x:160,y:14});const el={flame:'fire',frost:'water',thunder:'wind'}[id];if(el&&time>.4)ElementArt.draw(g,el,610,315,(time-.4)*1200);}}document.getElementById('phase').textContent=clip.options[clip.selectedIndex].text+' · '+Math.round(time*100)+'%';requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
