<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斜め斬り・動作検証</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1722;color:#e8e4d8;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}h1{font-size:23px}p{line-height:1.6;color:#aebfc9}canvas{width:100%;display:block;background:#122330;border:1px solid #756b49;border-radius:12px}button,select{font:inherit;background:#233c4b;color:#fff;border:1px solid #8e8056;border-radius:8px;padding:11px}nav,.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}input[type=range]{width:100%;min-height:35px}a{color:#e6c67d}.note{font-size:14px}output{color:#f5d98a;font-variant-numeric:tabular-nums}</style><main><h1>斜め斬りの連続軌道</h1><p>肩の外側で構え、身体の前を通り、脚の奥へ振り抜く動作の検証画面。完成キャラクターへの適用前です。</p><canvas id="view" width="900" height="440"></canvas><div class="controls"><button id="play">一時停止</button><select id="speed"><option value=".3">ゆっくり</option><option value="1">通常速度</option></select><label><input id="effects" type="checkbox">残光</label><label><input id="guides" type="checkbox" checked>軌道</label><output id="phase"></output></div><input id="seek" aria-label="動作の位置" type="range" min="0" max="1000" value="0"><nav><button data-p=".16">構え</button><button data-p=".43">通過</button><button data-p=".72">振り抜き</button><a href="motion-review.html">現在のゲーム動作</a></nav><p class="note">ゲーム側の画角と、同じ動きを90°回した横からの確認を表示します。青と茶は両腕の区別です。点線は手元と剣先の通り道。終点で一度止めてから再生を繰り返します。</p></main><script src="slash-rig.js"></script><script>
const g=view.getContext('2d');let p=0,playing=true,last=null,hold=0;
play.onclick=()=>{playing=!playing;play.textContent=playing?'一時停止':'再生';};
seek.oninput=()=>{p=+seek.value/1000;playing=false;play.textContent='再生';};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p=+b.dataset.p;playing=false;seek.value=p*1000;play.textContent='再生';});
function frame(now){const dt=last===null?0:Math.min(.05,(now-last)/1000);last=now;if(playing){if(p>=1){hold+=dt;if(hold>.8){p=0;hold=0;}}else p=Math.min(1,p+dt*+speed.value/.85);}const mobile=innerWidth<600;view.width=mobile?600:900;view.height=mobile?820:440;g.clearRect(0,0,view.width,view.height);g.fillStyle='#b9c8d0';g.font='17px system-ui';g.fillText('ゲーム側の画角',30,32);g.fillText('横から・奥行き確認',mobile?30:490,mobile?435:32);g.strokeStyle='#3c4a52';g.beginPath();g.moveTo(mobile?20:450,mobile?410:60);g.lineTo(mobile?580:450,mobile?410:415);g.stroke();const s=SlashRig.draw(g,p,{x:mobile?300:245,y:394,scale:mobile?1.1:1.3,effects:effects.checked,guides:guides.checked});SlashRig.draw(g,p,{x:mobile?300:680,y:mobile?794:394,scale:mobile?1.1:1.3,yaw:Math.PI/2,effects:effects.checked,guides:guides.checked});phase.textContent=s.phase+' '+Math.round(p*100)+'%';seek.value=p*1000;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
